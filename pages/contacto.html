<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contacto | Ruta Motor</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">RUTA MOTOR</a>
        <button class="navbar-toggler">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="galeria.html">Galería</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contacto.html">Contacto</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="nosotros.html">Nosotros</a>
            </li>
            <li class="nav-item ms-lg-2">
              <a class="btn btn-outline-light btn-sm" href="login.html"
                >Login</a
              >
            </li>
            <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
              <button class="btn btn-warning btn-sm">Suscribirme</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container py-5">
      <div class="text-center mb-5">
        <span class="section-kicker">ESTAMOS PARA AYUDAR</span>
        <h1 class="fw-bold">Contacto</h1>
        <p class="text-secondary">
          ¿Tenés una consulta, sugerencia o querés participar del blog?
        </p>
      </div>
      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body p-0 overflow-hidden rounded">
              <iframe
                title="Mapa de Jesús María, Córdoba"
                src="https://www.google.com/maps?q=Jesús%20María,%20Córdoba,%20Argentina&output=embed"
                width="100%"
                height="450"
                style="border: 0"
                loading="lazy"
              >
              </iframe>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body p-4 p-md-5">
              <h2 class="h4 fw-bold">Escribinos</h2>
              <form class="needs-validation demo-form mt-4" novalidate>
                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input class="form-control" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input class="form-control" type="email" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Asunto</label>
                  <input class="form-control" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Mensaje</label>
                  <textarea class="form-control" rows="6" required> </textarea>
                </div>
                <button class="btn btn-dark w-100">Enviar consulta</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="site-footer bg-dark text-light pt-5 pb-3">
      <div class="container">
        <div class="row g-4">
          <div class="col-12 col-md-6 col-lg-4">
            <strong class="fs-4">RUTA MOTOR</strong>
            <p class="text-white-50 mt-3">Pasión por los autos.</p>
          </div>
          <div class="col-12 col-md-6 col-lg-4">
            <h3 class="h6">REDES SOCIALES</h3>
            <div class="socials mt-3">
              <a href="404.html">
                <i class="bi bi-instagram"></i>
              </a>
              <a href="404.html">
                <i class="bi bi-facebook"></i>
              </a>
              <a href="404.html">
                <i class="bi bi-youtube"></i>
              </a>
            </div>
          </div>
          <div class="col-12 col-md-6 col-lg-4">
            <h3 class="h6">INFORMACIÓN</h3>
            <a class="footer-link d-block mt-3" href="nosotros.html"
              >Nosotros</a
            >
          </div>
        </div>
        <hr class="border-secondary my-4" />
        <p class="small text-white-50 text-center mb-0">© 2026 Ruta Motor</p>
      </div>
    </footer>
    <div class="modal fade" id="suscripcionModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5">Suscribite</h2>
            <button class="btn-close"></button>
          </div>
          <form class="demo-form">
            <div class="modal-body">
              <input class="form-control mb-3" placeholder="Nombre" required />
              <input
                class="form-control"
                type="email"
                placeholder="Email"
                required
              />
            </div>
            <div class="modal-footer">
              <button class="btn btn-warning">Suscribirme</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
